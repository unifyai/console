# Cloud Build pipeline for preview-environment Console revisions.
#
# Triggered on push to ``feature/*`` branches.  Builds the console
# image and deploys it as a tagged Cloud Run revision against the
# existing ``saas-web-app-redesign-staging`` service with
# ``--no-traffic``, so the canonical staging URL keeps serving the
# un-tagged revision and only the tagged URL routes this build.
#
# Peer service URLs (Orchestra, Comms App, Adapters) are pinned to
# the matching tagged revisions via runtime env vars so server-side
# Next.js code paths in this preview build call into the preview
# environment instead of leaking back to shared staging.

steps:
  - name: gcr.io/cloud-builders/docker
    id: compute-slug
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SLUG=$(echo "${BRANCH_NAME}" \
          | sed -E 's|^feature/||; s|[^a-z0-9-]+|-|g; s|^-+||; s|-+$||' \
          | tr '[:upper:]' '[:lower:]' \
          | cut -c1-30 \
          | sed -E 's|-+$||')
        if [ -z "$$SLUG" ]; then
          echo "ERROR: empty preview slug from branch name '${BRANCH_NAME}'" >&2
          exit 1
        fi
        echo "$$SLUG" > /workspace/slug.txt
        echo "preview slug: $$SLUG"
    waitFor: ['-']

  - name: gcr.io/cloud-builders/docker
    id: pull-cache
    entrypoint: bash
    args:
      - -c
      - 'docker pull $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest || true'
    waitFor: ['-']

  - name: gcr.io/cloud-builders/docker
    id: build-image
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SLUG=$(cat /workspace/slug.txt)
        DOCKER_BUILDKIT=1 docker build \
          --cache-from $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=$$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY \
          -f Dockerfile \
          -t $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:preview-$${SLUG}-$COMMIT_SHA .
    secretEnv: ['NEXT_SERVER_ACTIONS_ENCRYPTION_KEY']
    waitFor: ['compute-slug', 'pull-cache']

  - name: gcr.io/cloud-builders/docker
    id: push-image
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SLUG=$(cat /workspace/slug.txt)
        docker push $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:preview-$${SLUG}-$COMMIT_SHA
    waitFor: ['build-image']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-tagged
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SLUG=$(cat /workspace/slug.txt)
        ORCHESTRA_URL="https://$${SLUG}---${_PEER_ORCHESTRA_HOST}/v0"
        COMMS_URL="https://$${SLUG}---${_PEER_COMMS_HOST}"
        ADAPTERS_URL="https://$${SLUG}---${_PEER_ADAPTERS_HOST}"
        APP_URL="https://$${SLUG}---${_PEER_CONSOLE_HOST}"
        gcloud run deploy $_SERVICE_NAME \
          --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:preview-$${SLUG}-$COMMIT_SHA \
          --region=$_DEPLOY_REGION \
          --platform=managed \
          --tag=$${SLUG} \
          --no-traffic \
          --update-env-vars=BRANCH_TAG=$${SLUG},ORCHESTRA_URL=$${ORCHESTRA_URL},UNITY_COMMS_URL=$${COMMS_URL},UNITY_ADAPTERS_URL=$${ADAPTERS_URL},NEXT_PUBLIC_APP_URL=$${APP_URL} \
          --quiet
        echo "preview revision URL: $${APP_URL}"
    waitFor: ['push-image']

options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

substitutions:
  _PLATFORM: managed
  _SERVICE_NAME: saas-web-app-redesign-staging
  REPO_NAME: console
  _DEPLOY_REGION: us-central1
  _AR_HOSTNAME: europe-west3-docker.pkg.dev
  _PEER_CONSOLE_HOST: 'service.a.run.app'
  _PEER_COMMS_HOST: 'service.a.run.app'
  _PEER_ADAPTERS_HOST: 'service.a.run.app'
  _PEER_ORCHESTRA_HOST: 'service.a.run.app'

tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - preview

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/NEXT_SERVER_ACTIONS_ENCRYPTION_KEY/versions/latest
      env: 'NEXT_SERVER_ACTIONS_ENCRYPTION_KEY'

timeout: '1200s'
