steps:
  - id: Init Submodules
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    secretEnv: ['GITHUB_TOKEN']
    waitFor: ['-']
    args:
      - '-c'
      - |
        set -euo pipefail
        # The brand system lives in the private `branding` submodule (which itself
        # nests the private `iso-animation` submodule). Cloud Build checks out the
        # console repo without submodule contents, so fetch them here using the
        # DEVBOT token. The url.insteadOf rewrites are passed inline with `-c` so
        # they propagate to the child clone processes spawned for each submodule
        # (a global git config is not reliably honored in this builder image).
        git submodule sync --recursive branding
        git \
          -c url."https://x-access-token:$${GITHUB_TOKEN}@github.com/".insteadOf="git@github.com:" \
          -c url."https://x-access-token:$${GITHUB_TOKEN}@github.com/".insteadOf="ssh://git@github.com/" \
          -c url."https://x-access-token:$${GITHUB_TOKEN}@github.com/".insteadOf="https://github.com/" \
          submodule update --init --recursive --force branding

  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ['Init Submodules']
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE_URI="$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME"
        CACHE_REF="$${IMAGE_URI}:buildcache"

        docker buildx create --use --name console-cloud-builder --driver docker-container
        docker buildx build \
          --builder console-cloud-builder \
          --progress=plain \
          --cache-from type=registry,ref="$${CACHE_REF}" \
          --cache-to type=registry,ref="$${CACHE_REF}",mode=max \
          --build-arg NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=$$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY \
          -f Dockerfile \
          -t "$${IMAGE_URI}:$COMMIT_SHA" \
          -t "$${IMAGE_URI}:latest" \
          --push .
    id: Build
    secretEnv: ['NEXT_SERVER_ACTIONS_ENCRYPTION_KEY']

  - id: Proxy Install
    name: gcr.io/cloud-builders/npm
    entrypoint: sh
    args:
      - '-c'
      - 'wget https://storage.googleapis.com/cloudsql-proxy/v1.20.2/cloud_sql_proxy.linux.amd64 -O cloud_sql_proxy && chmod +x cloud_sql_proxy'
    waitFor: ['-']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    args:
      - '-c'
      - |
        set -euo pipefail
        run_cloud_run_with_retry() {
          local attempt max_attempts delay output output_file sleep_for status
          max_attempts=5
          delay=5
          for attempt in $$(seq 1 "$$max_attempts"); do
            output_file=$$(mktemp)
            set +e
            (set -e; "$${@}") > "$$output_file" 2>&1
            status=$$?
            set -e
            output=$$(cat "$$output_file")
            rm -f "$$output_file"
            printf '%s\n' "$$output"
            if [ "$$status" -eq 0 ]; then
              return 0
            fi
            if [[ "$$output" != *"ABORTED: Conflict for resource"* || "$$output" != *"was specified but current version is"* || "$$attempt" -eq "$$max_attempts" ]]; then
              return "$$status"
            fi
            sleep_for=$$((delay + RANDOM % 5))
            echo "Cloud Run service changed concurrently; retrying in $${sleep_for}s before attempt $$((attempt + 1))/$$max_attempts" >&2
        sleep "$$sleep_for"
            delay=$$((delay * 2))
          done
        }
        repair_traffic_state() {
        SERVICE_JSON=/tmp/service.json
        gcloud run services describe $_SERVICE_NAME \
          --region=$_DEPLOY_REGION \
          --platform=managed \
          --format=json > "$$SERVICE_JSON"
        python3 - "$$SERVICE_JSON" > /tmp/traffic-args.txt <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as service_file:
            service = json.load(service_file)

        revisions: list[str] = []
        status_tags: dict[str, str] = {}
        for entry in service.get("status", {}).get("traffic", []):
            revision = entry.get("revisionName")
            if not revision:
                continue
            percent = entry.get("percent")
            if percent is not None and int(percent) > 0:
                revisions.append(f"{revision}={int(percent)}")
            tag = entry.get("tag")
            if tag:
                status_tags[tag] = revision

        if not revisions:
            raise SystemExit("No live traffic revision found to preserve")

        spec_tags = {
            entry["tag"]: entry.get("revisionName")
            for entry in service.get("spec", {}).get("traffic", [])
            if entry.get("tag")
        }
        update_tags = [
            f"{tag}={revision}"
            for tag, revision in sorted(status_tags.items())
            if spec_tags.get(tag) != revision
        ]
        remove_tags = sorted(
            tag for tag in spec_tags
            if tag not in status_tags
        )

        print("--to-revisions=" + ",".join(revisions))
        if update_tags:
            print("--update-tags=" + ",".join(update_tags))
        if remove_tags:
            print("--remove-tags=" + ",".join(remove_tags))
        PY
        mapfile -t TRAFFIC_ARGS < /tmp/traffic-args.txt
        run_cloud_run_with_retry gcloud run services update-traffic $_SERVICE_NAME \
          --region=$_DEPLOY_REGION \
          --platform=managed \
          "$${TRAFFIC_ARGS[@]}" \
          --quiet
        }
        run_cloud_run_with_retry repair_traffic_state
    id: Repair Traffic State
    entrypoint: bash
    waitFor: ['Build']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: Deploy
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        run_cloud_run_with_retry() {
          local attempt max_attempts delay output output_file sleep_for status
          max_attempts=5
          delay=5
          for attempt in $$(seq 1 "$$max_attempts"); do
            output_file=$$(mktemp)
            set +e
            (set -e; "$${@}") > "$$output_file" 2>&1
            status=$$?
            set -e
            output=$$(cat "$$output_file")
            rm -f "$$output_file"
            printf '%s\n' "$$output"
            if [ "$$status" -eq 0 ]; then
              return 0
            fi
            if [[ "$$output" != *"ABORTED: Conflict for resource"* || "$$output" != *"was specified but current version is"* || "$$attempt" -eq "$$max_attempts" ]]; then
              return "$$status"
            fi
            sleep_for=$$((delay + RANDOM % 5))
            echo "Cloud Run service changed concurrently; retrying in $${sleep_for}s before attempt $$((attempt + 1))/$$max_attempts" >&2
          sleep "$$sleep_for"
            delay=$$((delay * 2))
          done
        }
        run_cloud_run_with_retry gcloud \
          run \
          services \
          update \
          $_SERVICE_NAME \
          --platform=managed \
          --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
          --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID \
          --region=$_DEPLOY_REGION \
          --quiet
    waitFor: ['Repair Traffic State']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    args:
      - '-c'
      - |
        set -euo pipefail
        run_cloud_run_with_retry() {
          local attempt max_attempts delay output output_file sleep_for status
          max_attempts=5
          delay=5
          for attempt in $$(seq 1 "$$max_attempts"); do
            output_file=$$(mktemp)
            set +e
            (set -e; "$${@}") > "$$output_file" 2>&1
            status=$$?
            set -e
            output=$$(cat "$$output_file")
            rm -f "$$output_file"
            printf '%s\n' "$$output"
            if [ "$$status" -eq 0 ]; then
              return 0
            fi
            if [[ "$$output" != *"ABORTED: Conflict for resource"* || "$$output" != *"was specified but current version is"* || "$$attempt" -eq "$$max_attempts" ]]; then
              return "$$status"
            fi
            sleep_for=$$((delay + RANDOM % 5))
            echo "Cloud Run service changed concurrently; retrying in $${sleep_for}s before attempt $$((attempt + 1))/$$max_attempts" >&2
        sleep "$$sleep_for"
            delay=$$((delay * 2))
          done
        }
        route_canonical_traffic() {
          REVISION=$$(gcloud run services describe $_SERVICE_NAME \
            --region=$_DEPLOY_REGION \
            --platform=managed \
            --format="value(status.latestCreatedRevisionName)")
          if [ -z "$$REVISION" ]; then
            echo "No deployed revision found for build $BUILD_ID" >&2
            return 1
          fi
          REVISION_BUILD_ID=$$(gcloud run revisions describe "$$REVISION" \
            --region=$_DEPLOY_REGION \
            --format="value(metadata.labels.gcb-build-id)")
          if [ "$$REVISION_BUILD_ID" != "$BUILD_ID" ]; then
            echo "Skipping traffic route for $$REVISION because it belongs to build $$REVISION_BUILD_ID"
            return 0
          fi
          gcloud run services update-traffic $_SERVICE_NAME \
            --platform=managed \
            --region=$_DEPLOY_REGION \
            --to-revisions="$$REVISION=100" \
            --quiet
        }
        run_cloud_run_with_retry route_canonical_traffic
    id: Route Traffic
    entrypoint: bash
    waitFor: ['Deploy']

  - name: 'gcr.io/cloud-builders/curl'
    id: Trigger Tests
    entrypoint: /bin/sh
    args:
      - -c
      - |
        if [ "$_SERVICE_NAME" = "saas-web-app" ]; then
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $$GITHUB_TOKEN" \
            https://api.github.com/repos/unifyai/console/dispatches \
            -d '{"event_type": "cloudbuild-complete", "client_payload": {"sha": "$COMMIT_SHA"}}'
        else
          echo "Skipping workflow dispatch for service $_SERVICE_NAME"
        fi
    secretEnv: ['GITHUB_TOKEN']

options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
substitutions:
  _PLATFORM: managed
  _SERVICE_NAME: saas-web-app-redesign-staging
  _TRIGGER_ID: 43a9d7a2-951c-49f5-af3c-234567890abc
  REPO_NAME: console
  _DEPLOY_REGION: us-central1
  _AR_HOSTNAME: europe-west3-docker.pkg.dev
tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DEVBOT_GITHUB_TOKEN/versions/latest
      env: 'GITHUB_TOKEN'
    - versionName: projects/$PROJECT_ID/secrets/NEXT_SERVER_ACTIONS_ENCRYPTION_KEY/versions/latest
      env: 'NEXT_SERVER_ACTIONS_ENCRYPTION_KEY'
