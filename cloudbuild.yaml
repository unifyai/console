steps:
  - id: Init Submodules
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    secretEnv: ['GITHUB_TOKEN']
    waitFor: ['-']
    args:
      - '-c'
      - |
        set -euo pipefail
        # The brand system lives in the private `branding` submodule (which itself
        # nests the private `iso-animation` submodule). Cloud Build checks out the
        # console repo without submodule contents, so fetch them here with the
        # DEVBOT token (which has read access to both private repos).
        #
        # Cloud Build injects its own source credential as an `http.<github>.extraheader`
        # Authorization header. That credential is scoped only to the triggering repo,
        # so it shadows our token and makes `branding` come back as "Repository not
        # found". Strip those inherited headers, then auth as the DEVBOT token.
        AUTH="https://x-access-token:$${GITHUB_TOKEN}@github.com/"

        echo "Inherited github extraheader config (redacted):"
        git config --get-regexp 'http\..*extraheader' 2>/dev/null | sed 's/=.*/= <redacted>/' || true
        git config --global --get-regexp 'http\..*extraheader' 2>/dev/null | sed 's/=.*/= <redacted>/' || true

        for scope in --local --global --system; do
          git config $$scope --unset-all http."https://github.com/".extraheader 2>/dev/null || true
          git config $$scope --unset-all http.extraheader 2>/dev/null || true
        done

        git submodule sync --recursive branding
        git \
          -c http."https://github.com/".extraheader= \
          -c http.extraheader= \
          -c url."$${AUTH}".insteadOf="git@github.com:" \
          -c url."$${AUTH}".insteadOf="ssh://git@github.com/" \
          -c url."$${AUTH}".insteadOf="https://github.com/" \
          submodule update --init --force branding
        git \
          -C branding \
          -c http."https://github.com/".extraheader= \
          -c http.extraheader= \
          -c url."$${AUTH}".insteadOf="git@github.com:" \
          -c url."$${AUTH}".insteadOf="ssh://git@github.com/" \
          -c url."$${AUTH}".insteadOf="https://github.com/" \
          submodule update --init --force packages/iso

  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ['Init Submodules']
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE_URI="$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME"
        CACHE_REF="$${IMAGE_URI}:buildcache"

        docker buildx create --use --name console-cloud-builder --driver docker-container
        docker buildx build \
          --builder console-cloud-builder \
          --progress=plain \
          --cache-from type=registry,ref="$${CACHE_REF}" \
          --cache-to type=registry,ref="$${CACHE_REF}",mode=max \
          --build-arg NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=$$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY \
          --build-arg NEXT_PUBLIC_MS_TEAMS_APP_CATALOG_ID=$$MS_TEAMS_APP_CATALOG_ID \
          --build-arg NEXT_PUBLIC_OPENREPLAY_PROJECT_KEY=$_OPENREPLAY_PROJECT_KEY \
          --build-arg NEXT_PUBLIC_OPENREPLAY_INGEST_POINT=$_OPENREPLAY_INGEST_POINT \
          --build-arg NEXT_PUBLIC_CANVAS_ORIGIN=$_CANVAS_ORIGIN \
          -f Dockerfile \
          -t "$${IMAGE_URI}:$COMMIT_SHA" \
          -t "$${IMAGE_URI}:latest" \
          --push .
    id: Build
    secretEnv: ['NEXT_SERVER_ACTIONS_ENCRYPTION_KEY', 'MS_TEAMS_APP_CATALOG_ID']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    args:
      - '-c'
      - |
        set -euo pipefail
        run_cloud_run_with_retry() {
          local attempt max_attempts delay output output_file sleep_for status
          max_attempts=5
          delay=5
          for attempt in $$(seq 1 "$$max_attempts"); do
            output_file=$$(mktemp)
            set +e
            (set -e; "$${@}") > "$$output_file" 2>&1
            status=$$?
            set -e
            output=$$(cat "$$output_file")
            rm -f "$$output_file"
            printf '%s\n' "$$output"
            if [ "$$status" -eq 0 ]; then
              return 0
            fi
            if [[ "$$output" != *"ABORTED: Conflict for resource"* || "$$output" != *"was specified but current version is"* || "$$attempt" -eq "$$max_attempts" ]]; then
              return "$$status"
            fi
            sleep_for=$$((delay + RANDOM % 5))
            echo "Cloud Run service changed concurrently; retrying in $${sleep_for}s before attempt $$((attempt + 1))/$$max_attempts" >&2
        sleep "$$sleep_for"
            delay=$$((delay * 2))
          done
        }
        repair_traffic_state() {
          local revision percent tag status_rows spec_rows
          local -a revisions=() update_tags=() remove_tags=() TRAFFIC_ARGS=()
          declare -A status_tags=() spec_tags=()

          join_by() {
            local IFS="$$1"
            shift
            printf '%s' "$$*"
          }

          status_rows=$$(gcloud run services describe $_SERVICE_NAME \
            --region=$_DEPLOY_REGION \
            --platform=managed \
            --flatten='status.traffic[]' \
            --format='csv[no-heading](status.traffic.revisionName,status.traffic.percent,status.traffic.tag)')

          while IFS=, read -r revision percent tag; do
            if [ -z "$$revision" ]; then
              continue
            fi
            if [ -n "$$percent" ] && [ "$$percent" -gt 0 ]; then
              revisions+=("$$revision=$$percent")
            fi
            if [ -n "$$tag" ]; then
              status_tags["$$tag"]="$$revision"
            fi
          done <<< "$$status_rows"

          if [ "$${#revisions[@]}" -eq 0 ]; then
            echo "No live traffic revision found to preserve" >&2
            return 1
          fi

          spec_rows=$$(gcloud run services describe $_SERVICE_NAME \
            --region=$_DEPLOY_REGION \
            --platform=managed \
            --flatten='spec.traffic[]' \
            --format='csv[no-heading](spec.traffic.revisionName,spec.traffic.tag)')

          while IFS=, read -r revision tag; do
            if [ -n "$$tag" ]; then
              spec_tags["$$tag"]="$$revision"
            fi
          done <<< "$$spec_rows"

          for tag in "$${!status_tags[@]}"; do
            if [ "$${spec_tags[$$tag]:-}" != "$${status_tags[$$tag]}" ]; then
              update_tags+=("$$tag=$${status_tags[$$tag]}")
            fi
          done

          for tag in "$${!spec_tags[@]}"; do
            if [ -z "$${status_tags[$$tag]+x}" ]; then
              remove_tags+=("$$tag")
            fi
          done

          TRAFFIC_ARGS=("--to-revisions=$$(join_by , "$${revisions[@]}")")
          if [ "$${#update_tags[@]}" -gt 0 ]; then
            TRAFFIC_ARGS+=("--update-tags=$$(join_by , "$${update_tags[@]}")")
          fi
          if [ "$${#remove_tags[@]}" -gt 0 ]; then
            TRAFFIC_ARGS+=("--remove-tags=$$(join_by , "$${remove_tags[@]}")")
          fi

          run_cloud_run_with_retry gcloud run services update-traffic $_SERVICE_NAME \
            --region=$_DEPLOY_REGION \
            --platform=managed \
            "$${TRAFFIC_ARGS[@]}" \
            --quiet
        }
        run_cloud_run_with_retry repair_traffic_state
    id: Repair Traffic State
    entrypoint: bash
    waitFor: ['Build']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: Deploy
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        run_cloud_run_with_retry() {
          local attempt max_attempts delay output output_file sleep_for status
          max_attempts=5
          delay=5
          for attempt in $$(seq 1 "$$max_attempts"); do
            output_file=$$(mktemp)
            set +e
            (set -e; "$${@}") > "$$output_file" 2>&1
            status=$$?
            set -e
            output=$$(cat "$$output_file")
            rm -f "$$output_file"
            printf '%s\n' "$$output"
            if [ "$$status" -eq 0 ]; then
              return 0
            fi
            if [[ "$$output" != *"ABORTED: Conflict for resource"* || "$$output" != *"was specified but current version is"* || "$$attempt" -eq "$$max_attempts" ]]; then
              return "$$status"
            fi
            sleep_for=$$((delay + RANDOM % 5))
            echo "Cloud Run service changed concurrently; retrying in $${sleep_for}s before attempt $$((attempt + 1))/$$max_attempts" >&2
          sleep "$$sleep_for"
            delay=$$((delay * 2))
          done
        }
        run_cloud_run_with_retry gcloud \
          run \
          services \
          update \
          $_SERVICE_NAME \
          --platform=managed \
          --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
          --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID \
          --region=$_DEPLOY_REGION \
          --quiet
    waitFor: ['Repair Traffic State']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    args:
      - '-c'
      - |
        set -euo pipefail
        run_cloud_run_with_retry() {
          local attempt max_attempts delay output output_file sleep_for status
          max_attempts=5
          delay=5
          for attempt in $$(seq 1 "$$max_attempts"); do
            output_file=$$(mktemp)
            set +e
            (set -e; "$${@}") > "$$output_file" 2>&1
            status=$$?
            set -e
            output=$$(cat "$$output_file")
            rm -f "$$output_file"
            printf '%s\n' "$$output"
            if [ "$$status" -eq 0 ]; then
              return 0
            fi
            if [[ "$$output" != *"ABORTED: Conflict for resource"* || "$$output" != *"was specified but current version is"* || "$$attempt" -eq "$$max_attempts" ]]; then
              return "$$status"
            fi
            sleep_for=$$((delay + RANDOM % 5))
            echo "Cloud Run service changed concurrently; retrying in $${sleep_for}s before attempt $$((attempt + 1))/$$max_attempts" >&2
        sleep "$$sleep_for"
            delay=$$((delay * 2))
          done
        }
        route_canonical_traffic() {
          REVISION=$$(gcloud run services describe $_SERVICE_NAME \
            --region=$_DEPLOY_REGION \
            --platform=managed \
            --format="value(status.latestCreatedRevisionName)")
          if [ -z "$$REVISION" ]; then
            echo "No deployed revision found for build $BUILD_ID" >&2
            return 1
          fi
          REVISION_BUILD_ID=$$(gcloud run revisions describe "$$REVISION" \
            --region=$_DEPLOY_REGION \
            --format="value(metadata.labels.gcb-build-id)")
          if [ "$$REVISION_BUILD_ID" != "$BUILD_ID" ]; then
            echo "Skipping traffic route for $$REVISION because it belongs to build $$REVISION_BUILD_ID"
            return 0
          fi
          gcloud run services update-traffic $_SERVICE_NAME \
            --platform=managed \
            --region=$_DEPLOY_REGION \
            --to-revisions="$$REVISION=100" \
            --quiet
        }
        run_cloud_run_with_retry route_canonical_traffic
    id: Route Traffic
    entrypoint: bash
    waitFor: ['Deploy']

  - name: 'gcr.io/cloud-builders/curl'
    id: Trigger Tests
    entrypoint: /bin/sh
    args:
      - -c
      - |
        if [ "$_SERVICE_NAME" = "saas-web-app" ]; then
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $$GITHUB_TOKEN" \
            https://api.github.com/repos/unifyai/console/dispatches \
            -d '{"event_type": "cloudbuild-complete", "client_payload": {"sha": "$COMMIT_SHA"}}'
        else
          echo "Skipping workflow dispatch for service $_SERVICE_NAME"
        fi
    secretEnv: ['GITHUB_TOKEN']

options:
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
substitutions:
  _PLATFORM: managed
  _SERVICE_NAME: saas-web-app-redesign-staging
  _TRIGGER_ID: 43a9d7a2-951c-49f5-af3c-234567890abc
  REPO_NAME: console
  _DEPLOY_REGION: us-central1
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  # Name of the Secret Manager secret holding the Teams app catalog/manifest id,
  # baked into the client bundle (as NEXT_PUBLIC_MS_TEAMS_APP_CATALOG_ID) so the
  # unbound "Add to Teams" install button can render. Staging and prod share this
  # project, so the value must differ by secret name: staging defaults here; the
  # prod trigger overrides it to MS_TEAMS_APP_CATALOG_ID. The referenced secret
  # must exist or the build fails (secretEnv is mandatory).
  _MS_TEAMS_CATALOG_SECRET: MS_TEAMS_APP_CATALOG_ID_STAGING
  # Self-hosted OpenReplay. Empty project key → tracker no-ops. After first
  # admin signup at openreplay.example.com, set the real project key on
  # the Cloud Build trigger (or here).
  _OPENREPLAY_PROJECT_KEY: ''
  # Origin serving the Canvas runtime host (see src/lib/canvas/origin.ts).
  # Inlined into the client bundle and the global CSP frame-src at build
  # time, so it has to be a build-arg, not runtime env. Staging defaults
  # here; the prod trigger overrides it to https://canvas.unify.ai.
  _CANVAS_ORIGIN: 'https://internal.example.com'
  _OPENREPLAY_INGEST_POINT: 'https://openreplay.example.com/ingest'
tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DEVBOT_GITHUB_TOKEN/versions/latest
      env: 'GITHUB_TOKEN'
    - versionName: projects/$PROJECT_ID/secrets/NEXT_SERVER_ACTIONS_ENCRYPTION_KEY/versions/latest
      env: 'NEXT_SERVER_ACTIONS_ENCRYPTION_KEY'
    - versionName: projects/$PROJECT_ID/secrets/$_MS_TEAMS_CATALOG_SECRET/versions/latest
      env: 'MS_TEAMS_APP_CATALOG_ID'
