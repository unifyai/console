name: Code Quality

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]
  workflow_dispatch:

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: |
          # Run lint and capture output
          npm run lint 2>&1 | tee lint-output.txt

          # Count warnings
          WARNING_COUNT=$(grep -c "Warning:" lint-output.txt || echo "0")

          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "::warning::Found $WARNING_COUNT ESLint warnings - these should be fixed"
          fi

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init branding submodule
        env:
          DEVBOT_GITHUB_TOKEN: ${{ secrets.DEVBOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEVBOT_GITHUB_TOKEN}" ]; then
            echo "::error::DEVBOT_GITHUB_TOKEN secret is not configured on this repository."
            echo "Add the DEVBOT read-only PAT (same value as Cloud Build uses) to GitHub Actions secrets."
            exit 1
          fi
          AUTH="https://x-access-token:${DEVBOT_GITHUB_TOKEN}@github.com/"
          git config --global url."${AUTH}".insteadOf "git@github.com:"
          git config --global url."${AUTH}".insteadOf "ssh://git@github.com/"
          git config --global url."${AUTH}".insteadOf "https://github.com/"
          for scope in --local --global; do
            git config "${scope}" --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git config "${scope}" --unset-all http.extraheader 2>/dev/null || true
          done
          git submodule sync --recursive branding
          git \
            -c http.https://github.com/.extraheader= \
            -c http.extraheader= \
            -c url."${AUTH}".insteadOf="git@github.com:" \
            -c url."${AUTH}".insteadOf="ssh://git@github.com/" \
            -c url."${AUTH}".insteadOf="https://github.com/" \
            submodule update --init --force branding
          git \
            -C branding \
            -c http.https://github.com/.extraheader= \
            -c http.extraheader= \
            -c url."${AUTH}".insteadOf="git@github.com:" \
            -c url."${AUTH}".insteadOf="ssh://git@github.com/" \
            -c url."${AUTH}".insteadOf="https://github.com/" \
            submodule update --init --force packages/iso

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init branding submodule
        env:
          DEVBOT_GITHUB_TOKEN: ${{ secrets.DEVBOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEVBOT_GITHUB_TOKEN}" ]; then
            echo "::error::DEVBOT_GITHUB_TOKEN secret is not configured on this repository."
            echo "Add the DEVBOT read-only PAT (same value as Cloud Build uses) to GitHub Actions secrets."
            exit 1
          fi
          AUTH="https://x-access-token:${DEVBOT_GITHUB_TOKEN}@github.com/"
          git config --global url."${AUTH}".insteadOf "git@github.com:"
          git config --global url."${AUTH}".insteadOf "ssh://git@github.com/"
          git config --global url."${AUTH}".insteadOf "https://github.com/"
          for scope in --local --global; do
            git config "${scope}" --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git config "${scope}" --unset-all http.extraheader 2>/dev/null || true
          done
          git submodule sync --recursive branding
          git \
            -c http.https://github.com/.extraheader= \
            -c http.extraheader= \
            -c url."${AUTH}".insteadOf="git@github.com:" \
            -c url."${AUTH}".insteadOf="ssh://git@github.com/" \
            -c url."${AUTH}".insteadOf="https://github.com/" \
            submodule update --init --force branding
          git \
            -C branding \
            -c http.https://github.com/.extraheader= \
            -c http.extraheader= \
            -c url."${AUTH}".insteadOf="git@github.com:" \
            -c url."${AUTH}".insteadOf="ssh://git@github.com/" \
            -c url."${AUTH}".insteadOf="https://github.com/" \
            submodule update --init --force packages/iso

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Next.js production build
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ci-build-placeholder-key-32chars!!
        run: npx next build

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init branding submodule
        env:
          DEVBOT_GITHUB_TOKEN: ${{ secrets.DEVBOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEVBOT_GITHUB_TOKEN}" ]; then
            echo "::error::DEVBOT_GITHUB_TOKEN secret is not configured on this repository."
            echo "Add the DEVBOT read-only PAT (same value as Cloud Build uses) to GitHub Actions secrets."
            exit 1
          fi
          AUTH="https://x-access-token:${DEVBOT_GITHUB_TOKEN}@github.com/"
          git config --global url."${AUTH}".insteadOf "git@github.com:"
          git config --global url."${AUTH}".insteadOf "ssh://git@github.com/"
          git config --global url."${AUTH}".insteadOf "https://github.com/"
          for scope in --local --global; do
            git config "${scope}" --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git config "${scope}" --unset-all http.extraheader 2>/dev/null || true
          done
          git submodule sync --recursive branding
          git \
            -c http.https://github.com/.extraheader= \
            -c http.extraheader= \
            -c url."${AUTH}".insteadOf="git@github.com:" \
            -c url."${AUTH}".insteadOf="ssh://git@github.com/" \
            -c url."${AUTH}".insteadOf="https://github.com/" \
            submodule update --init --force branding
          git \
            -C branding \
            -c http.https://github.com/.extraheader= \
            -c http.extraheader= \
            -c url."${AUTH}".insteadOf="git@github.com:" \
            -c url."${AUTH}".insteadOf="ssh://git@github.com/" \
            -c url."${AUTH}".insteadOf="https://github.com/" \
            submodule update --init --force packages/iso

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check formatting
        run: npm run format:check

  styles:
    name: Style Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check font class compliance
        run: npm run check:fonts:all

      - name: Check color compliance
        run: npm run check:colors:all
