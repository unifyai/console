          SAMPLE_MODE: pr
          GITHUB_SHA: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=4096
          PLAYWRIGHT_WORKERS: 2
          MAX_FAILURES: 10

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
