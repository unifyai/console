name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  should-run:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check.outputs.run_tests }}
    steps:
      - name: Check if tests should run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by workflow_dispatch"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$COMMIT_MSG" == *"[run-tests]"* ]]; then
              echo "run_tests=true" >> "$GITHUB_OUTPUT"
              echo "Tests triggered by commit message containing [run-tests]"
            else
              echo "run_tests=false" >> "$GITHUB_OUTPUT"
              echo "Skipping tests - commit message does not contain [run-tests]"
            fi
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_TITLE" == *"[run-tests]"* ]]; then
              echo "run_tests=true" >> "$GITHUB_OUTPUT"
              echo "Tests triggered by PR title containing [run-tests]"
            else
              echo "run_tests=false" >> "$GITHUB_OUTPUT"
              echo "Skipping tests - PR title does not contain [run-tests]"
            fi
            exit 0
          fi

          echo "run_tests=false" >> "$GITHUB_OUTPUT"
          echo "Skipping tests - unknown event type"

  assistants:
    needs: should-run
    if: needs.should-run.outputs.run_tests == 'true'
    name: Assistants
    runs-on: ubuntu-latest-4-cores
    timeout-minutes: 30
    steps:
      - name: Checkout Console
        uses: actions/checkout@v4

      - name: Checkout Orchestra
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/orchestra
          path: orchestra
          token: ${{ secrets.CLONE_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install "poetry>=2.1.0"

      - name: Cache Orchestra virtualenv
        uses: actions/cache@v4
        with:
          path: orchestra/.venv
          key: orchestra-venv-${{ runner.os }}-${{ hashFiles('orchestra/poetry.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start test environment
        run: bash scripts/ci-test-setup.sh --no-seed
        env:
          ORCHESTRA_REPO_PATH: ${{ github.workspace }}/orchestra

      - name: Run Assistants E2E tests
        run: |
          npx playwright test src/tests/assistants/ \
            --reporter=list 2>&1 | tee test-output.log

          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Assistants E2E tests failed"
          fi
          exit $EXIT_CODE
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-assistants
          path: playwright-report/
          retention-days: 7

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-assistants
          path: |
            test-output.log
            /tmp/console-ci.log
            /tmp/orchestra-local-server.log
          retention-days: 7

  account:
