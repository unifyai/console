  # ===========================================================================
  # BROWSER TESTS - Benchmarks (staging only)
  # ===========================================================================
  browser-benchmarks:
    needs: should-run-tests
    if: needs.should-run-tests.outputs.run_tests == 'true' && github.ref == 'refs/heads/staging'
    name: Benchmarks
    runs-on: ubuntu-latest-4-cores
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Vite dependencies
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            vite-${{ runner.os }}-

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Benchmark Tests
        run: |
          set -x
          echo "═══════════════════════════════════════════════════════════"
          echo "              BROWSER BENCHMARK TESTS (STAGING ONLY)"
          echo "═══════════════════════════════════════════════════════════"

          npx vitest --project browser-benchmarks --run \
            --reporter=verbose 2>&1 | tee test-output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ BENCHMARKS: PASSED"
          else
            echo "❌ BENCHMARKS: FAILED"
            echo ""
            echo "📋 FULL LOG:"
            cat test-output.log
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          exit $EXIT_CODE
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192

  # ===========================================================================
  # BROWSER MATRIX TESTS - 2 instances x 4 internal shards
  # ===========================================================================
  browser-matrix:
    needs: should-run-tests
    if: needs.should-run-tests.outputs.run_tests == 'true'
    name: Browser Matrix ${{ matrix.instance }}/2
    runs-on: ubuntu-latest-16-cores
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Browser Matrix Tests (4 shards per instance)
        run: |
          set -x
          echo "═══════════════════════════════════════════════════════════"
          echo "    BROWSER MATRIX TESTS - INSTANCE ${{ matrix.instance }}/2"
          echo "    (4 internal shards, 8 total across both instances)"
          echo "═══════════════════════════════════════════════════════════"

          SHARDS=4 SHARD_OFFSET=${{ matrix.instance }} npm run test:browser:matrix 2>&1 | tee test-output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ BROWSER MATRIX INSTANCE ${{ matrix.instance }}: PASSED"
          else
            echo "❌ BROWSER MATRIX INSTANCE ${{ matrix.instance }}: FAILED"
            echo ""
            echo "📋 FULL LOG:"
            cat test-output.log
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          exit $EXIT_CODE
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192
          PLOT_TEST_SAMPLE_RATE: '100'
