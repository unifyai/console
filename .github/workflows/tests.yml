name: Tests

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'CI tier to run (push, pr, or full exhaustive)'
        required: true
        default: full
        type: choice
        options:
          - push
          - pr
          - full
  push:
    branches:
      - '**'
  pull_request:
    branches: [main, staging]

# Debouncer semantics on push/dispatch: running matrices finish; only the
# pending slot is replaced. Feature PRs cancel in-progress for fast feedback.
# Release PRs (staging → main) do not cancel — tip churn must not drop the gate.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'staging' }}

jobs:
  resolve-tier:
    # Feature-branch PRs + staging→main release PRs. Skip other PRs whose head is
    # staging/main (avoids duplicate matrices). Push/dispatch always resolve.
    if: >-
      github.event_name != 'pull_request'
      || (github.head_ref != 'staging' && github.head_ref != 'main')
      || (github.head_ref == 'staging' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.resolve.outputs.tier }}
    steps:
      - name: Resolve CI tier
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TIER: ${{ github.event.inputs.tier }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "${DISPATCH_TIER:-full}" in
              push) echo "tier=push" >> "$GITHUB_OUTPUT"; echo "Manual Push Gate (workflow_dispatch)" ;;
              pr) echo "tier=pr" >> "$GITHUB_OUTPUT"; echo "Manual PR Gate (workflow_dispatch)" ;;
              full|*) echo "tier=full" >> "$GITHUB_OUTPUT"; echo "Manual exhaustive sweep (workflow_dispatch)" ;;
            esac
            exit 0
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$COMMIT_MSG" == *"[run-tests]"* ]]; then
              echo "tier=full" >> "$GITHUB_OUTPUT"
              echo "Exhaustive sweep triggered by [run-tests] in commit message"
            elif [[ "$REF_NAME" == "main" ]]; then
              # Release E2E is gated on the staging→main PR Push Gate (pre-merge).
              echo "tier=skip" >> "$GITHUB_OUTPUT"
              echo "Skip Push Gate on main push — already required on staging→main PRs"
            else
              echo "tier=push" >> "$GITHUB_OUTPUT"
              echo "Push Gate — every branch push without [run-tests]"
            fi
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_TITLE" == *"[run-tests]"* ]]; then
              echo "tier=full" >> "$GITHUB_OUTPUT"
              echo "Exhaustive sweep triggered by [run-tests] in PR title"
              exit 0
            fi
            if [[ "$PR_HEAD" == "staging" && "$PR_BASE" == "main" ]]; then
              echo "tier=push" >> "$GITHUB_OUTPUT"
              echo "Push Gate — release PR staging → main (pre-merge)"
              exit 0
            fi
            if [[ "$PR_BASE" == "main" || "$PR_BASE" == "staging" ]]; then
              echo "tier=pr" >> "$GITHUB_OUTPUT"
              echo "PR Gate — integration PR to ${PR_BASE}"
              exit 0
            fi
            echo "tier=push" >> "$GITHUB_OUTPUT"
            echo "Push Gate — PR to non-integration branch"
            exit 0
          fi

          echo "tier=push" >> "$GITHUB_OUTPUT"
          echo "Push Gate — default fallback"

  # Renamed from the required context: "Push Gate" is now republished by the
  # always-running tests-required job below. See the comment there.
  push-gate-run:
    needs: resolve-tier
    if: needs.resolve-tier.outputs.tier == 'push'
    name: Push Gate (run)
    runs-on: ubuntu-latest-4-cores
    timeout-minutes: 25
    steps:
      - name: Checkout Console
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CLONE_TOKEN }}

      - name: Checkout Orchestra
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/orchestra
          ref: ${{ github.ref_name == 'main' && 'main' || 'staging' }}
          path: orchestra
          token: ${{ secrets.CLONE_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Cache Orchestra uv deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: orchestra-uv-${{ runner.os }}-${{ hashFiles('orchestra/uv.lock') }}
          restore-keys: |
            orchestra-uv-${{ runner.os }}-

      - name: Install Orchestra dependencies
        run: cd "${{ github.workspace }}/orchestra" && uv sync --frozen

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Install Pub/Sub emulator
        run: bash scripts/ci-install-pubsub-emulator.sh

      - name: Start test environment
        run: bash scripts/ci-test-setup.sh --no-seed
        env:
          ORCHESTRA_REPO_PATH: ${{ github.workspace }}/orchestra

      - name: Run Push Gate E2E tests
        run: bash scripts/ci-playwright-run.sh push-gate
        env:
          CI: true
          SAMPLE_MODE: push
          GITHUB_SHA: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=4096
          PLAYWRIGHT_WORKERS: 3
          MAX_FAILURES: 1

      # Keep the same failure surfaces as PR gates (HTML report) plus raw
      # Playwright output (traces, error-context.md) so Push Gate regressions
      # remain diagnosable after the runner is gone.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-push-gate
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-push-gate
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-push-gate
          path: |
            test-output.log
            /tmp/console-build.log
            /tmp/console-ci.log
            /tmp/orchestra-local-server.log
            /tmp/pubsub-ci.log
            /tmp/pubsub-emulator-apt.log
          retention-days: 7
          if-no-files-found: ignore

  pr-gate-assistants:
    needs: resolve-tier
    if: needs.resolve-tier.outputs.tier == 'pr'
    name: PR Gate · Assistants
    runs-on: ubuntu-latest-4-cores
    timeout-minutes: 45
    steps:
      - name: Checkout Console
