name: Publish self-host Console image

on:
  push:
    branches: [staging, main]
    paths:
      - 'deploy/Dockerfile.selfhost'
      - 'src/**'
      - 'package.json'
      # The image installs with npm ci, so the lockfile and the branding
      # pointer it resolves decide what actually lands in it.
      - 'package-lock.json'
      - 'branding'
      - '.github/workflows/ghcr-selfhost.yml'
  workflow_dispatch:

# Debouncer semantics: let an in-flight image build finish.
concurrency:
  group: ghcr-selfhost-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Init branding submodule
        env:
          DEVBOT_GITHUB_TOKEN: ${{ secrets.DEVBOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEVBOT_GITHUB_TOKEN}" ]; then
            echo "::error::DEVBOT_GITHUB_TOKEN secret is not configured on this repository."
            echo "Add the DEVBOT read-only PAT (same value as Cloud Build uses) to GitHub Actions secrets."
            exit 1
          fi
          AUTH="https://x-access-token:${DEVBOT_GITHUB_TOKEN}@github.com/"
          git config --global url."${AUTH}".insteadOf "git@github.com:"
          git config --global url."${AUTH}".insteadOf "ssh://git@github.com/"
          git config --global url."${AUTH}".insteadOf "https://github.com/"
          for scope in --local --global; do
            git config "${scope}" --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git config "${scope}" --unset-all http.extraheader 2>/dev/null || true
          done
          git submodule sync --recursive branding
          git \
            -c http.https://github.com/.extraheader= \
            -c http.extraheader= \
            -c url."${AUTH}".insteadOf="git@github.com:" \
            -c url."${AUTH}".insteadOf="ssh://git@github.com/" \
            -c url."${AUTH}".insteadOf="https://github.com/" \
            submodule update --init --force branding
          git \
            -C branding \
            -c http.https://github.com/.extraheader= \
            -c http.extraheader= \
            -c url."${AUTH}".insteadOf="git@github.com:" \
            -c url."${AUTH}".insteadOf="ssh://git@github.com/" \
            -c url."${AUTH}".insteadOf="https://github.com/" \
            submodule update --init --force packages/iso

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.selfhost
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/unifyai/console-selfhost:${{ github.sha }}-${{ matrix.arch_tag }}
          build-args: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          TAG="${{ github.ref_name == 'main' && 'main' || 'staging' }}"
          docker buildx imagetools create -t ghcr.io/unifyai/console-selfhost:${TAG} \
            ghcr.io/unifyai/console-selfhost:${{ github.sha }}-amd64 \
            ghcr.io/unifyai/console-selfhost:${{ github.sha }}-arm64
