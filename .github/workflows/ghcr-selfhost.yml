name: Publish self-host Console image

on:
  push:
    branches: [staging, main]
    paths:
      - 'deploy/Dockerfile.selfhost'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/ghcr-selfhost.yml'
  workflow_dispatch:

concurrency:
  group: ghcr-selfhost-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.selfhost
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/unifyai/console-selfhost:${{ github.sha }}-${{ matrix.arch_tag }}
          build-args: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          TAG="${{ github.ref_name == 'main' && 'main' || 'staging' }}"
          docker buildx imagetools create -t ghcr.io/unifyai/console-selfhost:${TAG} \
            ghcr.io/unifyai/console-selfhost:${{ github.sha }}-amd64 \
            ghcr.io/unifyai/console-selfhost:${{ github.sha }}-arm64
