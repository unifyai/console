name: Tests

on:
  # Manual trigger - always runs tests
  workflow_dispatch:

  # Push events - tests only run if commit message contains [run-tests]
  push:
    branches:
      - '**'

  # Pull request events - tests only run if PR title contains [run-tests]
  pull_request:
    branches:
      - '**'

concurrency:
  group: tests-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Determine if tests should run based on trigger and commit/PR message
  should-run-tests:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check.outputs.run_tests }}
    steps:
      - name: Check if tests should run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # workflow_dispatch always runs tests
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by workflow_dispatch"
            exit 0
          fi

          # For push events, check commit message for [run-tests]
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$COMMIT_MSG" == *"[run-tests]"* ]]; then
              echo "run_tests=true" >> "$GITHUB_OUTPUT"
              echo "Tests triggered by commit message containing [run-tests]"
            else
              echo "run_tests=false" >> "$GITHUB_OUTPUT"
              echo "Skipping tests - commit message does not contain [run-tests]"
            fi
            exit 0
          fi

          # For pull_request events, check PR title for [run-tests]
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_TITLE" == *"[run-tests]"* ]]; then
              echo "run_tests=true" >> "$GITHUB_OUTPUT"
              echo "Tests triggered by PR title containing [run-tests]"
            else
              echo "run_tests=false" >> "$GITHUB_OUTPUT"
              echo "Skipping tests - PR title does not contain [run-tests]"
            fi
            exit 0
          fi

          # Default: don't run tests
          echo "run_tests=false" >> "$GITHUB_OUTPUT"
          echo "Skipping tests - unknown event type"

  api:
    needs: should-run-tests
    if: needs.should-run-tests.outputs.run_tests == 'true'
    name: API
    runs-on: ubuntu-latest
    environment: Preview

    services:
      orchestra-db:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: orchestra
          POSTGRES_USER: orchestra
          POSTGRES_DB: orchestra
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Console
        uses: actions/checkout@v4

      - name: Auth into Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Setup Python for Orchestra
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Clone Orchestra
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          ORCHESTRA_BRANCH=${{ github.ref_name == 'main' && 'main' || 'staging' }}
          git clone --depth 1 --branch $ORCHESTRA_BRANCH https://github.com/unifyai/orchestra.git orchestra
        env:
          GH_TOKEN: ${{ secrets.CLONE_TOKEN }}

      - name: Install Orchestra dependencies
        run: |
          cd orchestra
          poetry install --no-interaction
        env:
          POETRY_VIRTUALENVS_CREATE: 'false'

      - name: Run Orchestra migrations
        run: |
          cd orchestra
          poetry run alembic upgrade head
        env:
          POETRY_VIRTUALENVS_CREATE: 'false'
          ORCHESTRA_DB_HOST: localhost
          ORCHESTRA_DB_PORT: 5432
          ORCHESTRA_DB_USER: orchestra
          ORCHESTRA_DB_PASS: orchestra
          ORCHESTRA_DB_BASE: orchestra

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Seed Orchestra test data
        run: |
          PGPASSWORD=orchestra psql -h localhost -p 5432 -U orchestra -d orchestra -c "
          INSERT INTO users (id, credits, stripe_customer_id, autorecharge, autorecharge_threshold, autorecharge_qty, store_prompts, frozen)
          VALUES ('test-user-001', 10000, null, false, -1, 0, true, false)
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO auth_user (id, email, assistant_hiring_approval)
          VALUES ('test-user-001', 'test@debug.local', 'approved')
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO api_key (user_id, key)
          VALUES ('test-user-001', 'local-test-api-key')
          ON CONFLICT (key) DO NOTHING;

          -- Seed test voices (required before assistants due to FK)
          INSERT INTO voices (voice_id, user_id, provider, name, description, gender, language, is_preset) VALUES
            ('test-voice-preset-001', 'test-user-001', 'cartesia', 'Test Voice Preset', 'A preset test voice for CI', 'female', 'en', true),
            ('test-voice-custom-001', 'test-user-001', 'cartesia', 'Test Voice Custom', 'A custom test voice for CI delete tests', 'male', 'en', false)
          ON CONFLICT (user_id, voice_id, provider) DO NOTHING;

          -- Seed test assistants (multiple so delete tests don't break other tests)
          INSERT INTO assistants (agent_id, user_id, first_name, surname, age, nationality, profile_photo, profile_video, about, phone_country, timezone, weekly_limit, voice_id, voice_provider, voice_mode, created_at, updated_at) VALUES
            (1001, 'test-user-001', 'Test', 'Assistant', 30, 'United States', 'https://example.com/photo.jpg', 'https://example.com/video.mp4', 'Test assistant for CI integration tests', 'US', 'America/New_York', 40, 'test-voice-preset-001', 'cartesia', 'tts', NOW(), NOW()),
            (1002, 'test-user-001', 'Test', 'Deletable', 30, 'United States', 'https://example.com/photo.jpg', 'https://example.com/video.mp4', 'Test assistant that can be deleted', 'US', 'America/New_York', 40, 'test-voice-preset-001', 'cartesia', 'tts', NOW(), NOW())
          ON CONFLICT (agent_id) DO NOTHING;

          -- Update sequence to avoid conflicts when creating new assistants
          SELECT setval('assistants_agent_id_seq', (SELECT COALESCE(MAX(agent_id), 0) + 1 FROM assistants), false);

          -- Seed test organization (id=1) owned by test-user-001
          INSERT INTO organization (id, owner_id, name, credits, autorecharge, account_status)
          VALUES (1, 'test-user-001', 'Test Organization', 10000, false, 'ACTIVE')
          ON CONFLICT (id) DO NOTHING;

          -- Update organization sequence
          SELECT setval('organization_id_seq', (SELECT COALESCE(MAX(id), 0) + 1 FROM organization), false);

          -- Add test user as Owner member of the organization
          -- First get the Owner role ID (system role with organization_id IS NULL)
          INSERT INTO organization_member (organization_id, user_id, role_id)
          SELECT 1, 'test-user-001', r.id
          FROM role r
          WHERE r.name = 'Owner' AND r.organization_id IS NULL AND r.is_system_role = true
          ON CONFLICT DO NOTHING;

          -- Seed a test team in the organization
          INSERT INTO team (id, name, description, organization_id)
          VALUES (1, 'Engineering', 'Test engineering team', 1)
          ON CONFLICT (id) DO NOTHING;

          -- Update team sequence
          SELECT setval('team_id_seq', (SELECT COALESCE(MAX(id), 0) + 1 FROM team), false);

          -- Seed 'Assistants' project for logs/secrets functionality
          -- Required by secret.ts which stores secrets as logs in this project
          INSERT INTO project (id, user_id, name, description, icon)
          VALUES (1, 'test-user-001', 'Assistants', 'Project for assistant secrets', 'folder')
          ON CONFLICT (user_id, name) DO NOTHING;

          -- Update project sequence
          SELECT setval('project_id_seq', (SELECT COALESCE(MAX(id), 0) + 1 FROM project), false);
          "
          echo "✓ Orchestra test data seeded (users, voices, assistants, organization, team, project)"

      - name: Start Orchestra API
        run: |
          cd orchestra
          # GOOGLE_APPLICATION_CREDENTIALS is already set by the google-github-actions/auth step
          nohup poetry run python -m orchestra &
          sleep 10
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/v0/health || exit 1
        env:
          POETRY_VIRTUALENVS_CREATE: 'false'
          ORCHESTRA_HOST: '0.0.0.0'
          ORCHESTRA_PORT: '8000'
          ORCHESTRA_DB_HOST: localhost
          ORCHESTRA_DB_PORT: 5432
          ORCHESTRA_DB_USER: orchestra
          ORCHESTRA_DB_PASS: orchestra
          ORCHESTRA_DB_BASE: orchestra
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION }}
          ORCHESTRA_GCP_BUCKET_NAME: ${{ vars.GCP_BUCKET_LOGS }}
          ORCHESTRA_GCP_ASSISTANT_IMAGES_BUCKET_NAME: ${{ vars.GCP_BUCKET_ASSISTANT_IMAGES }}
          ORCHESTRA_GCP_ASSISTANT_RECORDINGS_BUCKET_NAME: ${{ vars.GCP_BUCKET_RECORDINGS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ORCHESTRA_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORCHESTRA_ADMIN_KEY: ${{ secrets.ORCHESTRA_ADMIN_KEY }}
          UNITY_COMMS_URL: ${{ secrets.UNITY_COMMS_URL }}
          UNITY_ADAPTERS_URL: ${{ secrets.UNITY_ADAPTERS_URL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ORCHESTRA_ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
          ORCHESTRA_REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Console
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-secret-placeholder
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_ORCHESTRA_URL: http://localhost:8000
          ORCHESTRA_ADMIN_KEY: ${{ secrets.ORCHESTRA_ADMIN_KEY }}

      - name: Start Console
        run: |
          npm run start &
          sleep 5
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000 || exit 1
        env:
          NEXTAUTH_SECRET: ci-secret-placeholder
          NEXTAUTH_URL: http://localhost:3000
          ORCHESTRA_URL: http://localhost:8000
          ORCHESTRA_ADMIN_KEY: ${{ secrets.ORCHESTRA_ADMIN_KEY }}

      - name: Run API Tests
        run: npm run test:real -- --run
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192
          ORCHESTRA_URL: http://localhost:8000
          NEXT_PUBLIC_ORCHESTRA_URL: http://localhost:8000
          VITE_TEST_API_KEY: local-test-api-key
