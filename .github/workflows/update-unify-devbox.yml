name: Update Unify in Devboxes

on:
  schedule:
    # Runs at 22:30 UTC every day
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @codesandbox/sdk

      - name: Update unify in devboxes
        run: node scripts/update_unify_devbox.js
        env:
          CODESANDBOX_API_KEY: ${{ secrets.CODESANDBOX_API_KEY }}
