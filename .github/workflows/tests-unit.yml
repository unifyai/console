name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: tests-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Unit Tests
        run: |
          # Run non-matrix unit tests only
          # Matrix tests are handled by tests-unit-matrix.yml
          npm run test:node -- --run --exclude='**/*.matrix.node.test.*'
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192
