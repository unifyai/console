name: Tests

on:
  # Manual trigger - always runs tests
  workflow_dispatch:

  # Push events - tests only run if commit message contains [run-tests]
  push:
    branches:
      - '**'

  # Pull request events - tests only run if PR title contains [run-tests]
  pull_request:
    branches:
      - '**'

concurrency:
  group: tests-unit-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Determine if tests should run based on trigger and commit/PR message
  should-run-tests:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check.outputs.run_tests }}
    steps:
      - name: Check if tests should run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # workflow_dispatch always runs tests
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by workflow_dispatch"
            exit 0
          fi

          # For push events, check commit message for [run-tests]
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$COMMIT_MSG" == *"[run-tests]"* ]]; then
              echo "run_tests=true" >> "$GITHUB_OUTPUT"
              echo "Tests triggered by commit message containing [run-tests]"
            else
              echo "run_tests=false" >> "$GITHUB_OUTPUT"
              echo "Skipping tests - commit message does not contain [run-tests]"
            fi
            exit 0
          fi

          # For pull_request events, check PR title for [run-tests]
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_TITLE" == *"[run-tests]"* ]]; then
              echo "run_tests=true" >> "$GITHUB_OUTPUT"
              echo "Tests triggered by PR title containing [run-tests]"
            else
              echo "run_tests=false" >> "$GITHUB_OUTPUT"
              echo "Skipping tests - PR title does not contain [run-tests]"
            fi
            exit 0
          fi

          # Default: don't run tests
          echo "run_tests=false" >> "$GITHUB_OUTPUT"
          echo "Skipping tests - unknown event type"

  # ===========================================================================
  # NODE MATRIX TESTS - Sharded across 4 parallel jobs
  # Each job gets its own isolated resources (8GB memory each)
  # ===========================================================================
  node-matrix:
    needs: should-run-tests
    if: needs.should-run-tests.outputs.run_tests == 'true'
    name: Node Matrix ${{ matrix.shard }}/4
    runs-on: ubuntu-latest-4-cores
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Node Matrix Tests
        run: |
          set -x
          echo "═══════════════════════════════════════════════════════════"
          echo "         NODE MATRIX TESTS - SHARD ${{ matrix.shard }}/4"
          echo "═══════════════════════════════════════════════════════════"

          # Run matrix tests with MATRIX_SHARD for internal config splitting
          # Uses node-matrix project which only includes *.matrix.node.test.ts files
          MATRIX_SHARD="${{ matrix.shard }}/4" npx vitest --project node-matrix --run \
            --reporter=verbose 2>&1 | tee test-output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ NODE MATRIX SHARD ${{ matrix.shard }}: PASSED"
          else
            echo "❌ NODE MATRIX SHARD ${{ matrix.shard }}: FAILED"
            echo ""
            echo "📋 FULL LOG:"
            cat test-output.log
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          exit $EXIT_CODE
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192
          # 50% sample rate: ~103K tests per shard, ~2 min per shard
          # Full matrix is 822K+ configs - too large to run in CI
          PLOT_TEST_SAMPLE_RATE: '50'
