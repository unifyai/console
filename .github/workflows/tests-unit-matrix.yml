name: Tests

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]
  workflow_dispatch:

concurrency:
  group: tests-unit-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-matrix:
    name: Unit Matrix Tests
    runs-on: ubuntu-latest-8-cores

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Node Matrix Tests (4 parallel processes)
        run: SHARDS=4 npm run test:node:matrix
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192
          PLOT_TEST_SAMPLE_RATE: '100'
