name: Tests

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]
  workflow_dispatch:

concurrency:
  group: tests-browser-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # BROWSER MATRIX TESTS - Split across 2 parallel job instances
  # Each instance runs 4 internal shards (8 total shards across 2 runners)
  # This reduces memory pressure per runner compared to 8 shards on 1 runner
  # ===========================================================================
  browser-matrix:
    name: Browser Matrix ${{ matrix.instance }}/2
    runs-on: ubuntu-latest-16-cores
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Browser Matrix Tests (4 shards per instance)
        run: |
          set -x
          echo "═══════════════════════════════════════════════════════════"
          echo "    BROWSER MATRIX TESTS - INSTANCE ${{ matrix.instance }}/2"
          echo "    (4 internal shards, 8 total across both instances)"
          echo "═══════════════════════════════════════════════════════════"

          # Run with instance-specific shard range
          # Instance 1: shards 1-4 of 8
          # Instance 2: shards 5-8 of 8
          SHARDS=4 SHARD_OFFSET=${{ matrix.instance }} npm run test:browser:matrix 2>&1 | tee test-output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ BROWSER MATRIX INSTANCE ${{ matrix.instance }}: PASSED"
          else
            echo "❌ BROWSER MATRIX INSTANCE ${{ matrix.instance }}: FAILED"
            echo ""
            echo "📋 FULL LOG:"
            cat test-output.log
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          exit $EXIT_CODE
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192
          PLOT_TEST_SAMPLE_RATE: '100'
