name: Tests

on:
  # Manual trigger - always runs tests
  workflow_dispatch:

  # Push events - tests only run if commit message contains [run-tests]
  push:
    branches:
      - '**'

  # Pull request events - tests only run if PR title contains [run-tests]
  pull_request:
    branches:
      - '**'

concurrency:
  group: tests-browser-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Determine if tests should run based on trigger and commit/PR message
  should-run-tests:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check.outputs.run_tests }}
    steps:
      - name: Check if tests should run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # workflow_dispatch always runs tests
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by workflow_dispatch"
            exit 0
          fi

          # For push events, check commit message for [run-tests]
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$COMMIT_MSG" == *"[run-tests]"* ]]; then
              echo "run_tests=true" >> "$GITHUB_OUTPUT"
              echo "Tests triggered by commit message containing [run-tests]"
            else
              echo "run_tests=false" >> "$GITHUB_OUTPUT"
              echo "Skipping tests - commit message does not contain [run-tests]"
            fi
            exit 0
          fi

          # For pull_request events, check PR title for [run-tests]
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_TITLE" == *"[run-tests]"* ]]; then
              echo "run_tests=true" >> "$GITHUB_OUTPUT"
              echo "Tests triggered by PR title containing [run-tests]"
            else
              echo "run_tests=false" >> "$GITHUB_OUTPUT"
              echo "Skipping tests - PR title does not contain [run-tests]"
            fi
            exit 0
          fi

          # Default: don't run tests
          echo "run_tests=false" >> "$GITHUB_OUTPUT"
          echo "Skipping tests - unknown event type"

  # ===========================================================================
  # BROWSER MATRIX TESTS - Split across 2 parallel job instances
  # Each instance runs 4 internal shards (8 total shards across 2 runners)
  # This reduces memory pressure per runner compared to 8 shards on 1 runner
  # ===========================================================================
  browser-matrix:
    needs: should-run-tests
    if: needs.should-run-tests.outputs.run_tests == 'true'
    name: Browser Matrix ${{ matrix.instance }}/2
    runs-on: ubuntu-latest-16-cores
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Browser Matrix Tests (4 shards per instance)
        run: |
          set -x
          echo "═══════════════════════════════════════════════════════════"
          echo "    BROWSER MATRIX TESTS - INSTANCE ${{ matrix.instance }}/2"
          echo "    (4 internal shards, 8 total across both instances)"
          echo "═══════════════════════════════════════════════════════════"

          # Run with instance-specific shard range
          # Instance 1: shards 1-4 of 8
          # Instance 2: shards 5-8 of 8
          SHARDS=4 SHARD_OFFSET=${{ matrix.instance }} npm run test:browser:matrix 2>&1 | tee test-output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ BROWSER MATRIX INSTANCE ${{ matrix.instance }}: PASSED"
          else
            echo "❌ BROWSER MATRIX INSTANCE ${{ matrix.instance }}: FAILED"
            echo ""
            echo "📋 FULL LOG:"
            cat test-output.log
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          exit $EXIT_CODE
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192
          PLOT_TEST_SAMPLE_RATE: '100'
