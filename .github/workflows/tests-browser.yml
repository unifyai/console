name: Browser Tests

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]
  workflow_dispatch:

concurrency:
  group: tests-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # ASSISTANTS - Heavy integration tests (chat, hire, call flows)
  # 7 files, ~8700 lines - needs more resources and sharding
  # ===========================================================================
  browser-assistants:
    name: Assistants ${{ matrix.shard }}/4
    runs-on: ubuntu-latest-4-cores
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Assistants Browser Tests
        run: |
          set -x
          echo "═══════════════════════════════════════════════════════════"
          echo "         ASSISTANTS BROWSER TESTS - SHARD ${{ matrix.shard }}/4"
          echo "═══════════════════════════════════════════════════════════"

          npm run test:browser -- --run \
            src/tests/assistants \
            --shard=${{ matrix.shard }}/4 \
            --exclude='**/generated/**' \
            --exclude='**/*.matrix.browser.test.*' \
            --exclude='**/*benchmarks*/**' \
            --reporter=verbose 2>&1 | tee test-output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ ASSISTANTS SHARD ${{ matrix.shard }}: PASSED"
          else
            echo "❌ ASSISTANTS SHARD ${{ matrix.shard }}: FAILED"
            echo ""
            echo "📋 FULL LOG:"
            cat test-output.log
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          exit $EXIT_CODE
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096

  # ===========================================================================
  # INTERFACES - UI behavior and integration tests
  # ~20 files - medium weight, 2 shards
  # ===========================================================================
  browser-interfaces:
    name: Interfaces ${{ matrix.shard }}/2
    runs-on: ubuntu-latest-4-cores
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Interfaces Browser Tests
        run: |
          set -x
          echo "═══════════════════════════════════════════════════════════"
          echo "         INTERFACES BROWSER TESTS - SHARD ${{ matrix.shard }}/2"
          echo "═══════════════════════════════════════════════════════════"

          npm run test:browser -- --run \
            src/tests/interfaces \
            --shard=${{ matrix.shard }}/2 \
            --exclude='**/generated/**' \
            --exclude='**/*.matrix.browser.test.*' \
            --exclude='**/*benchmarks*/**' \
            --reporter=verbose 2>&1 | tee test-output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ INTERFACES SHARD ${{ matrix.shard }}: PASSED"
          else
            echo "❌ INTERFACES SHARD ${{ matrix.shard }}: FAILED"
            echo ""
            echo "📋 FULL LOG:"
            cat test-output.log
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          exit $EXIT_CODE
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096

  # ===========================================================================
  # PLOT - Visualization tests (lighter weight)
  # 5 files - runs on cheaper 2-core, no sharding needed
  # ===========================================================================
  browser-plot:
    name: Plot Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Plot Browser Tests
        run: |
          set -x
          echo "═══════════════════════════════════════════════════════════"
          echo "                   PLOT BROWSER TESTS"
          echo "═══════════════════════════════════════════════════════════"

          npm run test:browser -- --run \
            src/tests/plot \
            --exclude='**/generated/**' \
            --exclude='**/*.matrix.browser.test.*' \
            --exclude='**/*benchmarks*/**' \
            --reporter=verbose 2>&1 | tee test-output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ PLOT TESTS: PASSED"
          else
            echo "❌ PLOT TESTS: FAILED"
            echo ""
            echo "📋 FULL LOG:"
            cat test-output.log
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          exit $EXIT_CODE
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096

  # ===========================================================================
  # USER - Organization/user tests (single file)
  # ===========================================================================
  browser-user:
    name: User Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run User Browser Tests
        run: |
          set -x
          echo "═══════════════════════════════════════════════════════════"
          echo "                   USER BROWSER TESTS"
          echo "═══════════════════════════════════════════════════════════"

          npm run test:browser -- --run \
            src/tests/user \
            --exclude='**/generated/**' \
            --exclude='**/*.matrix.browser.test.*' \
            --reporter=verbose 2>&1 | tee test-output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ USER TESTS: PASSED"
          else
            echo "❌ USER TESTS: FAILED"
            echo ""
            echo "📋 FULL LOG:"
            cat test-output.log
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          exit $EXIT_CODE
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096

  # ===========================================================================
  # BENCHMARKS - Performance tests (only on staging)
  # ===========================================================================
  browser-benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest-4-cores
    if: github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Benchmark Tests
        run: |
          set -x
          echo "═══════════════════════════════════════════════════════════"
          echo "              BROWSER BENCHMARK TESTS (STAGING ONLY)"
          echo "═══════════════════════════════════════════════════════════"

          npm run test:browser -- --run \
            benchmarks \
            --exclude='**/generated/**' \
            --exclude='**/*.matrix.browser.test.*' \
            --reporter=verbose 2>&1 | tee test-output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ BENCHMARKS: PASSED"
          else
            echo "❌ BENCHMARKS: FAILED"
            echo ""
            echo "📋 FULL LOG:"
            cat test-output.log
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          exit $EXIT_CODE
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192
