name: Browser Tests

on:
  # Manual trigger - always runs tests
  workflow_dispatch:

  # Push events - tests only run if commit message contains [run-tests]
  push:
    branches:
      - '**'

  # Pull request events - tests only run if PR title contains [run-tests]
  pull_request:
    branches:
      - '**'

concurrency:
  group: tests-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Determine if tests should run based on trigger and commit/PR message
  should-run-tests:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check.outputs.run_tests }}
    steps:
      - name: Check if tests should run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # workflow_dispatch always runs tests
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "Tests triggered by workflow_dispatch"
            exit 0
          fi

          # For push events, check commit message for [run-tests]
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$COMMIT_MSG" == *"[run-tests]"* ]]; then
              echo "run_tests=true" >> "$GITHUB_OUTPUT"
              echo "Tests triggered by commit message containing [run-tests]"
            else
              echo "run_tests=false" >> "$GITHUB_OUTPUT"
              echo "Skipping tests - commit message does not contain [run-tests]"
            fi
            exit 0
          fi

          # For pull_request events, check PR title for [run-tests]
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_TITLE" == *"[run-tests]"* ]]; then
              echo "run_tests=true" >> "$GITHUB_OUTPUT"
              echo "Tests triggered by PR title containing [run-tests]"
            else
              echo "run_tests=false" >> "$GITHUB_OUTPUT"
              echo "Skipping tests - PR title does not contain [run-tests]"
            fi
            exit 0
          fi

          # Default: don't run tests
          echo "run_tests=false" >> "$GITHUB_OUTPUT"
          echo "Skipping tests - unknown event type"

  # ===========================================================================
  # ASSISTANTS - Heavy integration tests (chat, hire, call flows)
  # 7 files, ~8700 lines - needs more resources and sharding
  # ===========================================================================
  browser-assistants:
    needs: should-run-tests
    if: needs.should-run-tests.outputs.run_tests == 'true'
    name: Assistants ${{ matrix.shard }}/4
    runs-on: ubuntu-latest-4-cores
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Vite dependencies
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            vite-${{ runner.os }}-

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Assistants Browser Tests
        run: |
          set -x
          echo "═══════════════════════════════════════════════════════════"
          echo "         ASSISTANTS BROWSER TESTS - SHARD ${{ matrix.shard }}/4"
          echo "═══════════════════════════════════════════════════════════"

          # Matrix and benchmark tests excluded via vitest.config.ts
          npm run test:browser -- --run \
            src/tests/assistants \
            --shard=${{ matrix.shard }}/4 \
            --reporter=verbose 2>&1 | tee test-output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ ASSISTANTS SHARD ${{ matrix.shard }}: PASSED"
          else
            echo "❌ ASSISTANTS SHARD ${{ matrix.shard }}: FAILED"
            echo ""
            echo "📋 FULL LOG:"
            cat test-output.log
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          exit $EXIT_CODE
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096

  # ===========================================================================
  # INTERFACES - UI behavior and integration tests
  # ~20 files - medium weight, 2 shards
