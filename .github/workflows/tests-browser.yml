  browser-benchmarks:
    needs: should-run-tests
    if: needs.should-run-tests.outputs.run_tests == 'true' && github.ref == 'refs/heads/staging'
    name: Benchmarks
    runs-on: ubuntu-latest-4-cores

    steps:
