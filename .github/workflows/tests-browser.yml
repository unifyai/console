          echo "         INTERFACES BROWSER TESTS - SHARD ${{ matrix.shard }}/2"
          echo "═══════════════════════════════════════════════════════════"

          # Matrix and benchmark tests excluded via vitest.config.ts
          npm run test:browser -- --run \
            src/tests/interfaces \
            --shard=${{ matrix.shard }}/2 \
            --reporter=verbose 2>&1 | tee test-output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ INTERFACES SHARD ${{ matrix.shard }}: PASSED"
          else
            echo "❌ INTERFACES SHARD ${{ matrix.shard }}: FAILED"
            echo ""
            echo "📋 FULL LOG:"
            cat test-output.log
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          exit $EXIT_CODE
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096

  # ===========================================================================
  # PLOT - Visualization tests (lighter weight)
  # 5 files - runs on cheaper 2-core, no sharding needed
  # ===========================================================================
  browser-plot:
    needs: should-run-tests
