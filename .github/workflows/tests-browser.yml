name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: tests-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest-4-cores
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Generate matrix test chunks
        run: npm run test:browser:generate

      - name: Run Browser Tests (Shard ${{ matrix.shard }}/4)
        run: npm run test:browser -- --run --shard=${{ matrix.shard }}/4
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192
          # Use split mode - matrix tests run from generated chunk files
          MATRIX_TEST_SPLIT: 'true'
          # Run 10% of matrix tests in CI to keep runtime reasonable
          PLOT_TEST_SAMPLE_RATE: '10'
