name: Tests

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]
  workflow_dispatch:

concurrency:
  group: tests-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser
    runs-on: ubuntu-latest-16-cores

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Browser Tests (8 parallel shards)
        run: |
          SHARDS=${SHARDS:-8}
          LOG_DIR=$(mktemp -d)
          EXIT_CODE=0

          echo "🚀 Running $SHARDS parallel shards..."

          for i in $(seq 1 $SHARDS); do
            npm run test:browser -- --run --shard=$i/$SHARDS \
              --exclude='**/generated/**' \
              --exclude='**/*.matrix.browser.test.*' > "$LOG_DIR/shard-$i.log" 2>&1 &
          done

          # Wait for all shards and collect exit codes
          for job in $(jobs -p); do
            wait $job || EXIT_CODE=1
          done

          # Show summaries
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          for i in $(seq 1 $SHARDS); do
            SUMMARY=$(grep -E "Tests.*passed|Tests.*failed" "$LOG_DIR/shard-$i.log" | tail -1 || echo "no summary")
            if grep -q "failed" <<< "$SUMMARY"; then
              echo "❌ Shard $i: $SUMMARY"
            else
              echo "✅ Shard $i: $SUMMARY"
            fi
          done

          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "View logs: $LOG_DIR"
          fi

          exit $EXIT_CODE
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=16384
