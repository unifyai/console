name: Test Demos

on:
  repository_dispatch:
    types: [cloudbuild-complete]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write

jobs:
  test-demos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.sha || github.ref }}
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install @codesandbox/sdk

      - name: Test demos
        run: node scripts/test_demos_devbox.js
        env:
          CODESANDBOX_API_KEY: ${{ secrets.CODESANDBOX_API_KEY }}
          CODESANDBOX_TEMPLATE_ID: ${{ secrets.CODESANDBOX_TEMPLATE_ID }}
          UNIFY_KEY: ${{ secrets.UNIFY_API_KEY }}
